<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book Dashboard</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--forest); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .forest { fill:var(--forest); } .emerald { fill:var(--emerald); } .wash { fill:var(--mint); } .pink { fill:var(--dramione); }
  .p-mint { fill:var(--mint); } .p-sage { fill:var(--mint-on-forest); opacity:.55; } .p-forest { fill:var(--forest); }
  .lg { rx:var(--radius-lg); } .xl { rx:var(--radius-xl); }
  .words { position:absolute; left:32px; bottom:32px; max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:84px; line-height:.95; font-weight:600; letter-spacing:-.02em; color:var(--forest); }
  .tag { margin:12px 0 0 2px; font-family:var(--font-display); font-style:italic; font-size:15px; line-height:20px; color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      forest 200x280 slab bled off the top and right (the masthead) · emerald 112x176 · mint 144x80 (the tint) · dramione pill 64x24 once (Dramione only) — about 40% of 960x288
  arrangement one tall forest slab with satellites stepping down to the left, bottoms on one line 32px above the edge
  pattern     pills, from "every interactive element is a pill": rows of 16px status-chip pills cut into the slab in mint, four forest pills on the tint
  scales      gutters space-4; blocks radius-xl / radius-lg; pills radius-pill (rx half of 16)
-->
<rect class="forest xl" x="304" y="-24" width="200" height="280" rx="20"/>
<rect class="emerald lg" x="176" y="80" width="112" height="176" rx="14"/>
<rect class="wash lg" x="16" y="136" width="144" height="80" rx="14"/>
<rect class="pink" x="16" y="232" width="64" height="24" rx="12"/>
<rect class="p-sage pill" x="328" y="48" width="72" height="16" rx="8"/>
<rect class="p-mint pill" x="408" y="48" width="40" height="16" rx="8"/>
<rect class="p-sage pill" x="456" y="48" width="56" height="16" rx="8"/>
<rect class="p-mint pill" x="328" y="80" width="48" height="16" rx="8"/>
<rect class="p-sage pill" x="384" y="80" width="88" height="16" rx="8"/>
<rect class="p-sage pill" x="328" y="112" width="64" height="16" rx="8"/>
<rect class="p-mint pill" x="400" y="112" width="32" height="16" rx="8"/>
<rect class="p-sage pill" x="440" y="112" width="48" height="16" rx="8"/>
<rect class="p-mint pill" x="328" y="144" width="96" height="16" rx="8"/>
<rect class="p-sage pill" x="432" y="144" width="40" height="16" rx="8"/>
<rect class="p-sage pill" x="328" y="176" width="40" height="16" rx="8"/>
<rect class="p-mint pill" x="376" y="176" width="56" height="16" rx="8"/>
<rect class="p-sage pill" x="440" y="176" width="40" height="16" rx="8"/>
<rect class="p-forest pill" x="32" y="152" width="56" height="16" rx="8"/>
<rect class="p-forest pill" x="96" y="152" width="40" height="16" rx="8"/>
<rect class="p-forest pill" x="32" y="176" width="40" height="16" rx="8"/>
<rect class="p-forest pill" x="80" y="176" width="64" height="16" rx="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Book<br>Dashboard</h1>
<p class="tag">Track your reading journey across all platforms</p>
</div>
</div>
</body>
</html>
