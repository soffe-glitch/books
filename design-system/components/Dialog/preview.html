<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div class="pv scrim" style="align-items:center;padding:24px">
  <div class="rating-dialog">
    <h3>Rate “The Way of Kings”</h3>
    <div class="rating-dialog-sub">How many stars?</div>
    <div class="rating-dialog-stars"><span class="rating-star selected">★</span><span class="rating-star selected">★</span><span class="rating-star selected">★</span><span class="rating-star selected">★</span><span class="rating-star selected">★</span></div>
    <div class="rating-dialog-selected">5 stars</div>
    <div class="rating-dialog-actions"><button class="btn btn-outline">Skip</button><button class="btn btn-primary">Save &amp; mark as read</button></div>
  </div>
  <div class="modal" style="max-width:100%">
    <h2>Edit Book</h2>
    <div class="modal-form">
      <div class="series-siblings"><h4>The Stormlight Archive</h4><a class="current">#1 The Way of Kings (currently-reading) &larr; this</a><a>#2 Words of Radiance (to-read)</a></div>
    </div>
    <div class="modal-actions" style="justify-content:space-between"><button class="btn btn-lg btn-delete">Delete</button><div style="display:flex;gap:0.5rem"><button class="btn btn-lg btn-outline">Cancel</button><button class="btn btn-lg btn-primary">Save</button></div></div>
  </div>
</div>
</body>
</html>
