<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ReadingCard</title></head>
<body>
<div class="pv" style="max-width:420px">
  <div class="cr-card">
    <div class="cr-card-title">The Way of Kings</div>
    <div class="cr-card-author">Brandon Sanderson</div>
    <div class="series-line">&#128218; The Stormlight Archive #1</div>
    <div class="cr-card-meta">1,007 pages · 383,389 words · Kindle Edition</div>
    <div class="cr-card-duration">Day 12 · started 2026/09/23</div>
    <div class="cr-card-actions"><button class="btn btn-primary">&#10003; Finished</button><button class="btn btn-outline">&#9208; Pause</button><button class="btn btn-dnf">DNF</button></div>
  </div>
  <div class="cr-card paused">
    <div class="cr-card-title">Manacled</div>
    <div class="cr-card-author">SenLinYu</div>
    <div class="cr-card-meta">363,000 words</div>
    <div class="cr-card-duration paused">&#9208; Paused on day 30 · started 2026/07/02</div>
    <div class="cr-card-actions"><button class="btn btn-primary">&#9654; Resume</button><button class="btn btn-primary">&#10003; Finished</button></div>
  </div>
</div>
</body>
</html>
