<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="pv">
  <div class="pv-row">
    <button class="btn btn-primary">&#10003; Finished</button>
    <button class="btn btn-outline">&#9208; Pause</button>
    <button class="btn btn-dnf">DNF</button>
    <button class="btn btn-primary" disabled>Saving…</button>
  </div>
  <div class="pv-row">
    <button class="btn btn-hero">Pick a random book</button>
    <button class="btn btn-lg btn-outline" style="font-weight:600;color:var(--text)">Cancel</button>
    <button class="btn btn-lg btn-primary">Save</button>
    <button class="btn btn-lg btn-delete">Delete</button>
  </div>
  <div class="pv-row">
    <button class="btn btn-xs btn-primary">Start</button>
    <button class="btn btn-xs btn-outline">Edit</button>
  </div>
</div>
</body>
</html>
