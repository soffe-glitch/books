<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Panel</title></head>
<body>
<div class="pv">
  <div class="stats-hero">
    <h2>2026 Reading Pace</h2>
    <div class="pace-numbers">
      <div class="pace-stat"><div class="pace-num" style="color:var(--primary)">38</div><div class="pace-label">books read</div></div>
      <div class="pace-stat"><div class="pace-num" style="color:var(--accent)">4.2</div><div class="pace-label">per month</div></div>
      <div class="pace-stat"><div class="pace-num" style="color:var(--gray-400)">51</div><div class="pace-label">projected EOY</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--gray-400);margin-bottom:0.35rem"><span>Jan</span><span>76% of year</span><span>Dec</span></div>
    <div class="bar-track" style="height:10px;border-radius:5px"><div class="bar-fill" style="width:76%;border-radius:5px"></div></div>
  </div>
  <div class="stats-panel"><h3>Reading Speed</h3><div style="display:flex;align-items:baseline;gap:0.5rem"><span style="font-size:2.2rem;font-weight:700;color:var(--primary);line-height:1">9.4</span><span style="font-size:0.85rem;color:var(--gray-400)">days per book</span></div></div>
</div>
</body>
</html>
