<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Sofie reading: long wavy blond hair, round glasses, eyes over a pink (Dramione) book. -->
  <rect width="1024" height="1024" fill="#064e3b"/>

  <!-- hair, back layer: long waves falling past the shoulders, scalloped edge -->
  <path d="M512 140
           C 320 140, 236 270, 244 420
           C 214 470, 266 512, 236 562
           C 206 612, 258 652, 228 702
           C 198 752, 250 792, 222 842
           C 206 884, 246 928, 300 936
           L 724 936
           C 778 928, 818 884, 802 842
           C 774 792, 826 752, 796 702
           C 766 652, 818 612, 788 562
           C 758 512, 810 470, 780 420
           C 788 270, 704 140, 512 140 Z" fill="#e2b85c"/>
  <!-- wave highlights -->
  <path d="M262 470 C 240 540, 280 590, 252 660 C 228 720, 262 780, 246 840" stroke="#f3d488" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M762 470 C 784 540, 744 590, 772 660 C 796 720, 762 780, 778 840" stroke="#f3d488" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M300 520 C 286 590, 318 640, 296 710 C 280 760, 300 820, 290 880" stroke="#c99a3e" stroke-width="14" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M724 520 C 738 590, 706 640, 728 710 C 744 760, 724 820, 734 880" stroke="#c99a3e" stroke-width="14" fill="none" stroke-linecap="round" opacity=".7"/>

  <!-- sweater / shoulders -->
  <path d="M300 930 C 320 840, 400 800, 512 800 C 624 800, 704 840, 724 930 Z" fill="#a7f3d0"/>
  <!-- neck -->
  <rect x="462" y="610" width="100" height="150" rx="40" fill="#efc2a6"/>

  <!-- face -->
  <ellipse cx="512" cy="470" rx="168" ry="196" fill="#f8d6c0"/>
  <!-- ears -->
  <ellipse cx="346" cy="490" rx="26" ry="40" fill="#f2c9b0"/>
  <ellipse cx="678" cy="490" rx="26" ry="40" fill="#f2c9b0"/>

  <!-- hair, front: side-swept wavy fringe framing the face -->
  <path d="M512 150
           C 372 150, 304 250, 322 400
           C 336 352, 366 318, 410 312
           C 470 304, 520 284, 556 246
           C 572 300, 612 336, 664 350
           C 690 358, 704 380, 706 410
           C 724 250, 650 150, 512 150 Z" fill="#e2b85c"/>
  <path d="M322 400 C 312 450, 340 500, 326 560 C 356 510, 350 450, 376 410 Z" fill="#e2b85c"/>
  <path d="M706 410 C 716 460, 688 510, 702 566 C 672 516, 678 460, 652 420 Z" fill="#e2b85c"/>
  <path d="M410 312 C 470 300, 520 282, 552 250" stroke="#f3d488" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M574 300 C 600 330, 640 346, 676 356" stroke="#c99a3e" stroke-width="10" fill="none" stroke-linecap="round" opacity=".6"/>
  <path d="M420 200 C 380 230, 356 270, 350 320" stroke="#f3d488" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- eyebrows -->
  <path d="M398 392 C 420 378, 456 376, 478 386" stroke="#b8893a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M546 386 C 568 376, 604 378, 626 392" stroke="#b8893a" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- eyes, looking down at the page -->
  <path d="M410 462 C 426 478, 456 478, 470 462" stroke="#10241b" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M554 462 C 568 478, 598 478, 614 462" stroke="#10241b" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M410 462 L 400 452 M470 462 L 480 452" stroke="#10241b" stroke-width="8" stroke-linecap="round"/>
  <path d="M554 462 L 544 452 M614 462 L 624 452" stroke="#10241b" stroke-width="8" stroke-linecap="round"/>

  <!-- round glasses -->
  <circle cx="440" cy="462" r="66" fill="#ffffff" fill-opacity=".14" stroke="#10241b" stroke-width="13"/>
  <circle cx="584" cy="462" r="66" fill="#ffffff" fill-opacity=".14" stroke="#10241b" stroke-width="13"/>
  <path d="M506 456 C 506 440, 518 440, 518 456" stroke="#10241b" stroke-width="12" fill="none"/>
  <path d="M374 452 L 346 444 M650 452 L 678 444" stroke="#10241b" stroke-width="10" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="410" cy="548" rx="34" ry="20" fill="#f49ab0" opacity=".55"/>
  <ellipse cx="614" cy="548" rx="34" ry="20" fill="#f49ab0" opacity=".55"/>

  <!-- the book, held up in front of the lower face -->
  <path d="M512 600 C 440 570, 330 566, 236 584 L 236 820 C 330 804, 440 810, 512 846 Z" fill="#f472b6"/>
  <path d="M512 600 C 584 570, 694 566, 788 584 L 788 820 C 694 804, 584 810, 512 846 Z" fill="#ec4899"/>
  <path d="M512 590 C 446 562, 350 560, 262 574 L 262 806 C 350 794, 446 800, 512 830 Z" fill="#d1fae5"/>
  <path d="M512 590 C 578 562, 674 560, 762 574 L 762 806 C 674 794, 578 800, 512 830 Z" fill="#ffffff"/>
  <path d="M512 590 L 512 830" stroke="#064e3b" stroke-opacity=".35" stroke-width="8"/>
  <!-- text lines -->
  <path d="M300 622 C 360 612, 420 616, 474 634 M300 662 C 360 652, 420 656, 474 674 M300 702 C 360 692, 420 696, 474 714 M300 742 C 350 734, 400 736, 440 748" stroke="#064e3b" stroke-opacity=".22" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M724 622 C 664 612, 604 616, 550 634 M724 662 C 664 652, 604 656, 550 674 M724 702 C 664 692, 604 696, 550 714" stroke="#064e3b" stroke-opacity=".22" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- small heart on the right page -->
  <path d="M640 770 C 624 758, 612 748, 612 736 C 612 726, 620 719, 629 719 C 635 719, 638 722, 640 727 C 642 722, 645 719, 651 719 C 660 719, 668 726, 668 736 C 668 748, 656 758, 640 770 Z" fill="#ec4899"/>
  <!-- hands -->
  <ellipse cx="236" cy="720" rx="34" ry="52" fill="#f8d6c0"/>
  <ellipse cx="788" cy="720" rx="34" ry="52" fill="#f8d6c0"/>
</svg>
