<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Sofie reading, editorial profile: slim figure facing right, head bowed over a pink book,
       long wavy blond hair down the back, thin oval glasses. Flat shapes, no outlines except the glasses. -->
  <rect width="1024" height="1024" fill="#064e3b"/>

  <g transform="translate(512 560) scale(1.1) translate(-574 -540)">
  <!-- shoulders / sweater -->
  <path d="M250 1024 C 262 900, 330 820, 452 792 C 520 778, 586 790, 640 820 C 700 852, 744 930, 760 1024 Z" fill="#a7f3d0"/>

  <!-- neck -->
  <path d="M512 556 C 516 640, 512 720, 500 800 L 588 808 C 574 736, 570 660, 580 588 Z" fill="#b97a52"/>

  <!-- hair, back: long waves falling behind the shoulder -->
  <path d="M520 214
           C 420 210, 344 270, 330 370
           C 318 452, 350 500, 330 570
           C 310 640, 352 690, 332 760
           C 316 820, 340 880, 316 940
           C 306 970, 300 1000, 296 1024
           L 452 1024
           C 446 960, 472 910, 456 850
           C 440 790, 478 742, 462 680
           C 448 622, 486 580, 484 520
           C 482 470, 500 430, 520 400 Z" fill="#d9b25f"/>
  <path d="M372 400 C 356 470, 386 520, 366 590 C 348 650, 382 700, 364 770 C 350 830, 372 880, 356 940" stroke="#f0d28a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M420 470 C 408 530, 434 580, 418 640 C 404 700, 436 750, 420 820 C 408 870, 428 920, 414 990" stroke="#b88c3a" stroke-width="10" fill="none" stroke-linecap="round" opacity=".8"/>

  <!-- face in profile, bowed slightly -->
  <path d="M520 236
           C 580 238, 624 280, 636 340
           C 642 368, 650 390, 670 420
           C 678 432, 674 442, 660 446
           L 650 448
           C 654 460, 652 470, 644 476
           C 650 484, 648 494, 638 500
           C 636 520, 622 538, 596 548
           C 568 560, 536 566, 506 562
           C 470 520, 470 420, 480 330
           C 486 280, 500 246, 520 236 Z" fill="#d09068"/>

  <!-- hair, front: crown and a wave sweeping over the temple and behind the ear -->
  <path d="M498 196
           C 572 186, 640 230, 646 300
           C 620 286, 590 290, 566 312
           C 548 328, 530 360, 520 410
           C 512 450, 500 480, 484 500
           C 470 430, 462 360, 470 300
           C 476 250, 484 214, 498 196 Z" fill="#d9b25f"/>
  <path d="M520 214 C 572 214, 616 244, 632 286" stroke="#f0d28a" stroke-width="11" fill="none" stroke-linecap="round"/>

  <!-- closed, downcast eye with lashes -->
  <path d="M584 384 C 594 396, 610 398, 622 390" stroke="#10241b" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M592 394 L 588 404 M603 397 L 601 408 M614 395 L 615 405" stroke="#10241b" stroke-width="4" stroke-linecap="round"/>
  <!-- brow -->
  <path d="M580 352 C 598 344, 620 346, 634 356" stroke="#9c7330" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- thin oval glasses -->
  <ellipse cx="606" cy="390" rx="34" ry="26" fill="#ffffff" fill-opacity=".12" stroke="#10241b" stroke-width="6"/>
  <path d="M572 386 L 526 378" stroke="#10241b" stroke-width="6" stroke-linecap="round"/>

  <!-- lips -->
  <path d="M640 478 C 634 482, 628 482, 622 480" stroke="#8a4b3a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- the book, held open and tilted toward her -->
  <g transform="rotate(-14 700 640)">
    <path d="M700 560 C 650 540, 600 538, 556 548 L 556 720 C 600 712, 650 716, 700 740 Z" fill="#ec4899"/>
    <path d="M700 560 C 750 540, 812 538, 860 548 L 860 720 C 812 712, 750 716, 700 740 Z" fill="#f472b6"/>
    <path d="M700 552 C 656 534, 612 532, 572 540 L 572 708 C 612 702, 656 706, 700 726 Z" fill="#ffffff"/>
    <path d="M700 552 C 744 534, 800 532, 844 540 L 844 708 C 800 702, 744 706, 700 726 Z" fill="#d1fae5"/>
    <path d="M700 552 L 700 726" stroke="#064e3b" stroke-opacity=".3" stroke-width="5"/>
    <path d="M596 580 C 626 574, 656 576, 684 588 M596 610 C 626 604, 656 606, 684 618 M596 640 C 626 634, 656 636, 684 648 M716 588 C 746 576, 786 574, 822 580 M716 618 C 746 606, 786 604, 822 610" stroke="#064e3b" stroke-opacity=".2" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  </g>
</svg>
